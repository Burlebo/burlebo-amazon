<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snapshot — Burlebo Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/auth.js"></script>
<style>
  :root {
    --bg: #0d0f12; --panel: #14171c; --panel-2: #1a1e25;
    --border: #252a33; --text: #e8eaed; --text-dim: #8a92a0;
    --accent: #ff6b35; --green: #4ade80; --red: #f87171; --yellow: #fbbf24; --blue: #38bdf8; --purple: #a78bfa; --gold: #fbbf24; --teal: #2dd4bf;
    --radius: 10px; --radius-sm: 6px;
    --coy: #ff6b35;      --coy-bg: rgba(255, 107, 53, 0.15);
    --designer: #a78bfa; --designer-bg: rgba(167, 139, 250, 0.15);
    --admin: #4ade80;    --admin-bg: rgba(74, 222, 128, 0.15);
    --employee: #38bdf8; --employee-bg: rgba(56, 189, 248, 0.15);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'DM Sans', system-ui, sans-serif; }
  header { border-bottom: 1px solid var(--border); padding: 18px 32px; display: flex; align-items: center; justify-content: space-between; background: var(--panel); }
  header h1 { font-size: 18px; font-weight: 700; margin: 0; }
  header nav { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  header nav a { color: var(--text-dim); text-decoration: none; font-size: 14px; font-weight: 500; }
  header nav a:hover { color: var(--text); }
  header nav a.active { color: var(--accent); }
  .role-pill { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .role-pill:hover { opacity: 0.85; }
  .role-pill.coy { background: var(--coy-bg); color: var(--coy); }
  .role-pill.designer { background: var(--designer-bg); color: var(--designer); }
  .role-pill.admin { background: var(--admin-bg); color: var(--admin); }
  .role-pill.employee { background: var(--employee-bg); color: var(--employee); }

  main { max-width: 1400px; margin: 0 auto; padding: 28px 32px; }
  main.hidden { display: none; }
  .page-title { font-size: 28px; font-weight: 700; margin: 0 0 4px 0; }
  .page-sub { font-size: 14px; color: var(--text-dim); margin: 0 0 24px 0; }

  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 16px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 20px; }
  .ctrl-label { font-size: 12px; color: var(--text-dim); font-weight: 500; }
  .btn { padding: 7px 14px; border-radius: var(--radius-sm); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: var(--panel-2); color: var(--text); }
  .btn:hover { background: #1f242c; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: white; }
  .btn.primary:hover { opacity: 0.92; }
  .btn.ghost { background: transparent; color: var(--text-dim); }

  .section-title { font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); margin: 24px 0 12px; }
  .section-title:first-child { margin-top: 0; }

  /* 3-column daily row */
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
  @media (max-width: 900px) { .grid-3 { grid-template-columns: 1fr; } }

  /* 6-column rolling-kpi row */
  .kpi-row-6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-bottom: 12px; }
  @media (max-width: 1100px) { .kpi-row-6 { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 600px)  { .kpi-row-6 { grid-template-columns: repeat(2, 1fr); } }

  /* 4-column smaller rolling-kpi row */
  .kpi-row-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
  @media (max-width: 800px) { .kpi-row-4 { grid-template-columns: repeat(2, 1fr); } }

  .kpi { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; position: relative; overflow: hidden; }
  .kpi::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
  .kpi.orange::before { background: var(--accent); }
  .kpi.blue::before { background: var(--blue); }
  .kpi.green::before { background: var(--green); }
  .kpi.purple::before { background: var(--purple); }
  .kpi.gold::before { background: var(--gold); }
  .kpi.red::before { background: var(--red); }
  .kpi.teal::before { background: var(--teal); }
  .kpi-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
  .kpi-value { font-size: 22px; font-weight: 700; line-height: 1.1; }
  .kpi-delta { font-size: 12px; font-weight: 600; margin-top: 4px; }
  .kpi-delta.up { color: var(--green); }
  .kpi-delta.down { color: var(--red); }
  .kpi-delta.flat { color: var(--text-dim); }
  .kpi-day-card .kpi-value { font-size: 26px; }

  .mini-kpi { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; position: relative; overflow: hidden; }
  .mini-kpi::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
  .mini-kpi.orange::before { background: var(--accent); }
  .mini-kpi.gold::before { background: var(--gold); }
  .mini-kpi.purple::before { background: var(--purple); }
  .mini-kpi.blue::before { background: var(--blue); }
  .mini-kpi.teal::before { background: var(--teal); }
  .mini-kpi-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
  .mini-kpi-value { font-size: 18px; font-weight: 700; line-height: 1.1; }

  /* Goal card */
  .goal-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 24px; }
  .goal-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; gap: 12px; flex-wrap: wrap; }
  .goal-main { font-size: 22px; font-weight: 700; }
  .goal-main .of-goal { font-weight: 500; color: var(--text-dim); font-size: 13px; }
  .goal-pace { font-size: 20px; font-weight: 700; }
  .goal-pace.ahead { color: var(--green); }
  .goal-pace.behind { color: var(--red); }
  .goal-bar-track { height: 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
  .goal-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), #ff9758); transition: width 0.4s; }
  .goal-foot { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim); margin-top: 8px; }

  /* Two-column for top SKUs / FBA alerts */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; }
  .card-title { font-size: 14px; font-weight: 600; margin: 0 0 12px 0; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 4px; border-bottom: 1px solid var(--border); }
  th { color: var(--text-dim); font-weight: 600; text-transform: uppercase; font-size: 10px; letter-spacing: 0.06em; }
  td.r, th.r { text-align: right; }
  td.mono { font-family: 'SF Mono', Menlo, monospace; font-size: 12px; }
  tr:last-child td { border-bottom: none; }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .badge.green  { background: rgba(74, 222, 128, 0.15);  color: var(--green); }
  .badge.orange { background: rgba(255, 107, 53, 0.15);  color: var(--accent); }
  .badge.red    { background: rgba(248, 113, 113, 0.15); color: var(--red); }
  .badge.muted  { background: var(--panel-2);            color: var(--text-dim); }

  .all-good { color: var(--green); font-size: 13px; padding: 20px 0; }
  .scroll-wrap { max-height: 260px; overflow-y: auto; }

  .empty { text-align: center; padding: 60px 20px; color: var(--text-dim); background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); }
  .empty-icon { font-size: 36px; margin-bottom: 8px; }
  .empty-title { font-size: 15px; margin-bottom: 4px; color: var(--text); }
  .empty-sub { font-size: 13px; }
  .loading { color: var(--text-dim); font-size: 14px; padding: 40px 0; text-align: center; }

  /* Role modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.72); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000; }
  .modal-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; width: 380px; max-width: calc(100vw - 32px); }
  .modal-title { font-size: 18px; font-weight: 700; margin: 0 0 6px 0; }
  .modal-sub { font-size: 13px; color: var(--text-dim); margin: 0 0 20px 0; }
  .modal-options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .modal-option { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); padding: 13px 14px; border-radius: var(--radius-sm); font-family: inherit; font-size: 14px; font-weight: 500; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 10px; }
  .modal-option:hover { background: #1f242c; border-color: #2f3540; }
  .modal-option .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .modal-option .dot.coy { background: var(--coy); }
  .modal-option .dot.designer { background: var(--designer); }
  .modal-option .dot.admin { background: var(--admin); }
  .modal-option .dot.employee { background: var(--employee); }
  .pw-field { display: none; margin-top: 8px; }
  .pw-field input { width: 100%; padding: 11px 12px; font-family: 'DM Sans', sans-serif; font-size: 14px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius-sm); outline: none; margin-bottom: 8px; }
  .pw-field input:focus { border-color: var(--accent); }
  .pw-error { display: none; font-size: 12px; color: var(--red); margin-bottom: 8px; }
  .pw-row { display: flex; gap: 8px; }
</style></head>
<body>

<!-- Role modal -->

<header id="app-header" style="display:none;">
  <h1>Burlebo Analytics</h1>
  <nav id="main-nav">
    <span class="role-pill" id="role-pill"></span>
  </nav>
</header>

<main id="app-main" class="hidden">
  <div class="page-title">Lost Sales</div>
  <div class="page-sub">Revenue missed to stockouts and lost Featured Offer, measured from actual detail-page traffic</div>

  <div class="controls">
    <span class="ctrl-label">Range</span>
    <select id="ls-range" class="inp" style="max-width:160px">
      <option value="30">Last 30 days</option>
      <option value="90" selected>Last 90 days</option>
      <option value="180">Last 180 days</option>
      <option value="0">All history</option>
    </select>
    <span class="ctrl-label">Offset substitution</span>
    <select id="ls-offset" class="inp" style="max-width:150px">
      <option value="1" selected>On (net)</option>
      <option value="0">Off (gross)</option>
    </select>
    <button class="btn primary" onclick="runLostSales()">🔄 Run</button>
    <span class="ctrl-label" id="ls-range-label"></span>
  </div>

  <div id="ls-kpis"></div>
  <div id="ls-bleeding"></div>
  <div id="ls-content">
    <div class="empty"><div class="empty-icon">📉</div><div class="empty-title">Choose a range and hit Run</div></div>
  </div>
  <div id="ls-method"></div>
</main>

<script>
  async function loadSharedNav() {
    try {
      const r = await fetch('/nav.html', { cache: 'no-cache' });
      if (!r.ok) return;
      const html = await r.text();
      const nav = document.getElementById('main-nav');
      const pill = document.getElementById('role-pill');
      const tmp = document.createElement('div');
      tmp.innerHTML = html;
      const here = window.location.pathname.replace(/\/$/, '') || '/';
      for (const a of tmp.querySelectorAll('a')) {
        const href = a.getAttribute('href');
        if (href === here || (href === '/' && here === '/')) a.classList.add('active');
        nav.insertBefore(a, pill);
      }
    } catch (err) { console.error('Nav load failed:', err); }
  }

  async function fetchPaged(table, columns, filters = []) {
    const all = [];
    let from = 0;
    const page = 1000;
    while (true) {
      let q = sb.from(table).select(columns);
      for (const [k, op, v] of filters) q = q[op](k, v);
      q = q.order('id', { ascending: true }).range(from, from + page - 1);
      const { data, error } = await q;
      if (error) throw new Error(error.message);
      if (!data || data.length === 0) break;
      all.push(...data);
      if (data.length < page) break;
      from += page;
    }
    return all;
  }

  // ==========================================================================
  // Supabase + auth
  // ==========================================================================
  const SUPABASE_URL = 'https://uoetojuyzyngfopsmmxk.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVvZXRvanV5enluZ2ZvcHNtbXhrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzODY3ODIsImV4cCI6MjA5NDk2Mjc4Mn0.FVhs_0waTWIYkTVY2j4HERhlovggIFau07RuBu69M8E';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  window.onAuthReady = function (r) {
    loadSharedNav();
    runLostSales();
  };

  // ==========================================================================
  // Tunables — all in one place so the method stays auditable
  // ==========================================================================
  const CFG = {
    MIN_SESSIONS_TO_JUDGE: 5,   // below this, a zero-unit day is just noise
    HEALTHY_BB: 0.90,           // at/above this the offer counts as held, for baselines
    MIN_HEALTHY_DAYS: 10,       // days needed for a trustworthy per-ASIN CVR
    MAX_CVR: 0.40,              // sanity ceiling; above this is a data artifact
    BB_LOSS_FLOOR: 0.85,        // only investigate featured-offer loss below this
    BB_DEFICIT_MIN: 0.25,       // and only when conversion is >=25% below baseline
  };

  const fmtUSD = n => '$' + Math.round(n).toLocaleString();
  const fmtN   = n => Math.round(n).toLocaleString();
  const pct    = n => (n * 100).toFixed(1) + '%';
  const median = a => { if (!a.length) return null; const s=[...a].sort((x,y)=>x-y); const m=s.length>>1;
                        return s.length%2 ? s[m] : (s[m-1]+s[m])/2; };

  let _last = null;

  // ==========================================================================
  // Main
  // ==========================================================================
  async function runLostSales() {
    const content = document.getElementById('ls-content');
    document.getElementById('ls-kpis').innerHTML = '';
    document.getElementById('ls-bleeding').innerHTML = '';
    document.getElementById('ls-method').innerHTML = '';
    content.innerHTML = '<div class="loading">Crunching traffic history…</div>';

    try {
      const days = parseInt(document.getElementById('ls-range').value, 10);

      const { data: latest } = await sb.from('sales_daily')
        .select('date').order('date', { ascending: false }).limit(1);
      if (!latest || !latest.length) { content.innerHTML = '<div class="empty"><div class="empty-title">No sales data found</div></div>'; return; }
      const maxDate = latest[0].date;

      const filters = [];
      let startDate = null;
      if (days > 0) {
        const d = new Date(maxDate + 'T00:00:00Z');
        d.setUTCDate(d.getUTCDate() - (days - 1));
        startDate = d.toISOString().slice(0, 10);
        filters.push(['date', 'gte', startDate]);
      }

      const rows = await fetchPaged('sales_daily',
        'date, sku, is_fba, parent_asin, child_asin, title, sessions, buy_box_pct, units, revenue', filters);

      if (!rows.length) { content.innerHTML = '<div class="empty"><div class="empty-title">No rows in that range</div></div>'; return; }

      document.getElementById('ls-range-label').textContent =
        `${startDate || rows.reduce((a,r)=>r.date<a?r.date:a, rows[0].date)} → ${maxDate}`;

      const result = analyze(rows, document.getElementById('ls-offset').value === '1');
      _last = result;
      render(result, maxDate);

    } catch (err) {
      console.error(err);
      content.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-title">Something went wrong</div><div class="hint">${err.message}</div></div>`;
    }
  }

  // ==========================================================================
  // Step 1 — collapse SKU rows to one row per ASIN per day.
  // Sessions are an ASIN-level metric REPEATED on each SKU row (verified against
  // the Business Report: dual FBA/MFN offers carry identical session counts), so
  // they are maxed, not summed. Units and revenue are genuinely per-SKU: summed.
  // ==========================================================================
  function collapse(rows) {
    const map = new Map();
    for (const r of rows) {
      const asin = r.child_asin || r.sku;
      if (!asin) continue;
      const k = r.date + '|' + asin;
      let e = map.get(k);
      if (!e) {
        e = { date: r.date, asin, parent: r.parent_asin || asin, title: r.title || asin,
              sessions: 0, units: 0, revenue: 0, bb: null };
        map.set(k, e);
      }
      e.sessions = Math.max(e.sessions, Number(r.sessions) || 0);
      e.units   += Number(r.units)   || 0;
      e.revenue += Number(r.revenue) || 0;
      const bb = r.buy_box_pct == null ? null : Number(r.buy_box_pct);
      if (bb != null && !isNaN(bb)) e.bb = Math.max(e.bb == null ? -1 : e.bb, bb > 1 ? bb / 100 : bb);
      if (!e.title && r.title) e.title = r.title;
    }
    return [...map.values()];
  }

  // ==========================================================================
  // Step 2 — per-ASIN baselines from healthy days only
  // ==========================================================================
  function buildBaselines(byAsin, catalogCvr) {
    const parentCvr = new Map();
    for (const a of byAsin.values()) {
      if (a.cvrOwn == null) continue;
      if (!parentCvr.has(a.parent)) parentCvr.set(a.parent, []);
      parentCvr.get(a.parent).push(a.cvrOwn);
    }
    for (const a of byAsin.values()) {
      if (a.cvrOwn != null) { a.cvr = a.cvrOwn; a.cvrSrc = 'own'; }
      else {
        const sib = parentCvr.get(a.parent);
        if (sib && sib.length) { a.cvr = median(sib); a.cvrSrc = 'style'; }
        else { a.cvr = catalogCvr; a.cvrSrc = 'catalog'; }
      }
    }
  }

  // ==========================================================================
  // Step 3 — classify every in-window day and price the loss
  // ==========================================================================
  function analyze(rows, useOffset) {
    const daily = collapse(rows);
    daily.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);

    const byAsin = new Map();
    for (const d of daily) {
      let a = byAsin.get(d.asin);
      if (!a) { a = { asin: d.asin, parent: d.parent, title: d.title, days: [] }; byAsin.set(d.asin, a); }
      a.days.push(d);
      if (!a.title && d.title) a.title = d.title;
    }

    // per-ASIN baseline conversion + realized ASP, from healthy days only
    const allCvr = [];
    for (const a of byAsin.values()) {
      const healthy = a.days.filter(d =>
        d.units > 0 && d.sessions >= CFG.MIN_SESSIONS_TO_JUDGE &&
        (d.bb == null || d.bb >= CFG.HEALTHY_BB) && (d.units / d.sessions) <= CFG.MAX_CVR);
      a.healthyDays = healthy.length;
      a.cvrOwn = healthy.length >= CFG.MIN_HEALTHY_DAYS ? median(healthy.map(d => d.units / d.sessions)) : null;
      a.asp    = healthy.length ? median(healthy.filter(d=>d.units>0).map(d => d.revenue / d.units)) : null;
      a.dailyUnits = healthy.length ? median(healthy.map(d => d.units)) : 0;
      if (a.cvrOwn != null) allCvr.push(a.cvrOwn);
    }
    const catalogCvr = median(allCvr) || 0.04;
    const catalogAsp = median([...byAsin.values()].map(a => a.asp).filter(x => x != null)) || 0;
    buildBaselines(byAsin, catalogCvr);
    for (const a of byAsin.values()) if (a.asp == null) a.asp = catalogAsp;

    // classify days inside each ASIN's live window
    for (const a of byAsin.values()) {
      const live = a.days.filter(d => d.sessions > 0);
      a.liveFrom = live.length ? live[0].date : null;
      a.liveTo   = live.length ? live[live.length - 1].date : null;
      a.stockoutDays = 0; a.bbDays = 0; a.lostSessions = 0;
      a.grossUnits = 0; a.bbUnits = 0;

      for (const d of a.days) {
        if (!a.liveFrom || d.date < a.liveFrom || d.date > a.liveTo) { d.state = 'pre'; continue; }
        if (d.sessions < CFG.MIN_SESSIONS_TO_JUDGE) { d.state = 'thin'; continue; }

        if (d.units === 0) {
          d.state = 'stockout';
          a.stockoutDays++;
          a.lostSessions += d.sessions;
          d.lost = d.sessions * a.cvr;
          a.grossUnits += d.lost;
        } else if (d.bb != null && d.bb < CFG.BB_LOSS_FLOOR) {
          // Losing the featured offer does NOT by itself mean losing sales — you
          // often still convert, and on dual-offer ASINs your own FBA and MFN
          // listings trade it between themselves. So only count a real shortfall
          // in conversion against this ASIN's own baseline.
          const actual = d.units / d.sessions;
          const deficit = a.cvr - actual;
          if (deficit > 0 && deficit >= a.cvr * CFG.BB_DEFICIT_MIN) {
            d.state = 'buybox';
            a.bbDays++;
            d.lost = d.sessions * deficit;
            a.bbUnits += d.lost;
          } else {
            d.state = 'healthy';
          }
        } else {
          d.state = 'healthy';
        }
      }
    }

    // substitution offset: siblings picking up demand on stockout days
    const byParentDate = new Map();
    for (const a of byAsin.values())
      for (const d of a.days) {
        const k = a.parent + '|' + d.date;
        if (!byParentDate.has(k)) byParentDate.set(k, []);
        byParentDate.get(k).push({ a, d });
      }

    for (const a of byAsin.values()) a.offset = 0;
    if (useOffset) {
      for (const a of byAsin.values()) {
        for (const d of a.days) {
          if (d.state !== 'stockout') continue;
          const peers = (byParentDate.get(a.parent + '|' + d.date) || []).filter(p => p.a !== a && p.d.state === 'healthy');
          let excess = 0;
          for (const p of peers) excess += Math.max(0, p.d.units - (p.a.dailyUnits || 0));
          a.offset += Math.min(excess, d.lost);   // never credit back more than was lost
        }
        a.offset = Math.min(a.offset, a.grossUnits);
      }
    }

    const out = [];
    for (const a of byAsin.values()) {
      const net = Math.max(0, a.grossUnits - a.offset) + a.bbUnits;
      if (net < 0.5 && a.stockoutDays === 0 && a.bbDays === 0) continue;
      out.push({
        asin: a.asin, title: a.title, cvr: a.cvr, cvrSrc: a.cvrSrc, asp: a.asp,
        stockoutDays: a.stockoutDays, bbDays: a.bbDays, lostSessions: a.lostSessions,
        avgBb: (() => { const v=a.days.filter(d=>d.bb!=null).map(d=>d.bb); return v.length?median(v):null; })(),
        gross: a.grossUnits, offset: a.offset, bbUnits: a.bbUnits,
        net, lostRevenue: net * a.asp,
        lastState: a.days.length ? a.days[a.days.length - 1].state : null,
        healthyDays: a.healthyDays,
      });
    }
    out.sort((x, y) => y.lostRevenue - x.lostRevenue);
    return { rows: out, catalogCvr, useOffset, asinCount: byAsin.size };
  }

  // ==========================================================================
  // Render
  // ==========================================================================
  function render(res, maxDate) {
    const R = res.rows;
    const totNet   = R.reduce((s, r) => s + r.net, 0);
    const totRev   = R.reduce((s, r) => s + r.lostRevenue, 0);
    const totOOS   = R.reduce((s, r) => s + Math.max(0, r.gross - r.offset), 0);
    const totBB    = R.reduce((s, r) => s + r.bbUnits, 0);
    const totOff   = R.reduce((s, r) => s + r.offset, 0);
    const oosAsins = R.filter(r => r.stockoutDays > 0).length;
    const oosDays  = R.reduce((s, r) => s + r.stockoutDays, 0);

    document.getElementById('ls-kpis').innerHTML = `
      <div class="cards">
        <div class="card"><div class="card-label">Lost revenue</div><div class="card-value">${fmtUSD(totRev)}</div>
          <div class="hint">${res.useOffset ? 'net of substitution' : 'gross, no offset'}</div></div>
        <div class="card"><div class="card-label">Lost units</div><div class="card-value">${fmtN(totNet)}</div>
          <div class="hint">${fmtN(totOOS)} stockout · ${fmtN(totBB)} featured offer</div></div>
        <div class="card"><div class="card-label">Stockout days</div><div class="card-value">${fmtN(oosDays)}</div>
          <div class="hint">across ${fmtN(oosAsins)} ASINs</div></div>
        <div class="card"><div class="card-label">Recovered by siblings</div><div class="card-value">${fmtN(totOff)}</div>
          <div class="hint">units picked up by other sizes/colors</div></div>
      </div>`;

    // currently bleeding
    const bleeding = R.filter(r => r.lastState === 'stockout').slice(0, 12);
    document.getElementById('ls-bleeding').innerHTML = !bleeding.length ? '' : `
      <div class="vhead"><div><h2>🔴 Out of stock right now</h2>
        <p class="hint">Still zero-converting as of ${maxDate}. Daily bleed is that ASIN's traffic × its own conversion rate.</p></div></div>
      <table><thead><tr><th>Product</th><th>ASIN</th><th class="r">Days out</th><th class="r">Bleed / day</th></tr></thead><tbody>
      ${bleeding.map(r => `<tr><td>${esc(r.title)}</td><td class="mono">${r.asin}</td>
        <td class="r">${fmtN(r.stockoutDays)}</td>
        <td class="r">${fmtUSD((r.lostSessions / Math.max(1, r.stockoutDays)) * r.cvr * r.asp)}</td></tr>`).join('')}
      </tbody></table>`;

    const top = R.slice(0, 150);
    document.getElementById('ls-content').innerHTML = `
      <div class="vhead"><div><h2>Ranked by lost revenue</h2>
        <p class="hint">Top ${top.length} of ${R.length} affected ASINs. Fix from the top.</p></div>
        <button class="btn ghost" onclick="exportCsv()">⬇ Export CSV</button></div>
      <table>
        <thead><tr>
          <th>Product</th><th>ASIN</th>
          <th class="r">OOS days</th><th class="r">BB days</th><th class="r">Med. BB%</th>
          <th class="r">Lost sessions</th><th class="r">CVR</th>
          <th class="r">Gross units</th><th class="r">Offset</th>
          <th class="r">Net units</th><th class="r">Lost revenue</th>
        </tr></thead>
        <tbody>${top.map(r => `<tr>
          <td>${esc(r.title)}${r.cvrSrc !== 'own' ? ` <span class="hint">(${r.cvrSrc} cvr)</span>` : ''}</td>
          <td class="mono">${r.asin}</td>
          <td class="r">${r.stockoutDays || '—'}</td>
          <td class="r">${r.bbDays || '—'}</td>
          <td class="r">${r.avgBb == null ? '—' : pct(r.avgBb)}</td>
          <td class="r">${fmtN(r.lostSessions)}</td>
          <td class="r">${pct(r.cvr)}</td>
          <td class="r">${fmtN(r.gross)}</td>
          <td class="r">${r.offset > 0.5 ? '−' + fmtN(r.offset) : '—'}</td>
          <td class="r"><b>${fmtN(r.net)}</b></td>
          <td class="r"><b>${fmtUSD(r.lostRevenue)}</b></td>
        </tr>`).join('')}</tbody>
      </table>`;

    document.getElementById('ls-method').innerHTML = `
      <div class="note" style="margin-top:18px">
        <b>How this is calculated.</b>
        Lost units on a stockout day = that ASIN's detail-page sessions × its own baseline conversion rate,
        so demand is measured from people who actually showed up rather than extrapolated from past velocity.
        Baseline conversion uses healthy days only (offer held, ${CFG.MIN_SESSIONS_TO_JUDGE}+ sessions, units sold);
        ASINs with fewer than ${CFG.MIN_HEALTHY_DAYS} such days fall back to a style-level rate, then the
        catalog median (${pct(res.catalogCvr)}) — the table flags which was used.
        Featured-offer loss is measured, not assumed: only on days below ${pct(CFG.BB_LOSS_FLOOR)} Buy Box
        <i>and</i> where actual conversion came in at least ${pct(CFG.BB_DEFICIT_MIN)} under this ASIN's own
        baseline, counted as sessions × the shortfall. Losing the featured offer while still converting
        normally records nothing — which matters on ASINs carrying both an FBA and an MFN offer, where the
        two trade it between themselves.
        Substitution offset credits back units that other sizes or colorways in the same parent picked up
        above their own baseline on those days, capped at the amount lost.
        Days outside an ASIN's live window and days under ${CFG.MIN_SESSIONS_TO_JUDGE} sessions are excluded,
        so pre-launch and dead SKUs don't generate phantom losses.
        Revenue uses realized ASP from healthy days, not list price, so discounting is reflected.
      </div>`;
  }

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  function exportCsv() {
    if (!_last) return;
    const head = ['ASIN','Title','OOS days','BuyBox days','Lost sessions','CVR','CVR source','ASP','Gross units','Offset','Net units','Lost revenue'];
    const lines = [head.join(',')].concat(_last.rows.map(r => [
      r.asin, '"' + String(r.title).replace(/"/g,'""') + '"', r.stockoutDays, r.bbDays,
      Math.round(r.lostSessions), (r.cvr*100).toFixed(2)+'%', r.cvrSrc, r.asp.toFixed(2),
      r.gross.toFixed(1), r.offset.toFixed(1), r.net.toFixed(1), r.lostRevenue.toFixed(2)
    ].join(',')));
    const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'lost-sales-' + new Date().toISOString().slice(0,10) + '.csv';
    a.click();
  }

  document.getElementById('ls-range').addEventListener('change', runLostSales);
  document.getElementById('ls-offset').addEventListener('change', runLostSales);

</script>
</body>
</html>
